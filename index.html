<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>azimuth</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.min.css">
<style>
  :root {
    --bg: #f7f6f3;
    --panel: #fffefb;
    --line: #ddd8cf;
    --ink: #2b2723;
    --dim: #6f6759;
    --accent: #b4531d;
    --accent-soft: #f3e3d4;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.45 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    display: flex;
  }

  /* ---------------- panel ---------------- */
  /* #side is the desktop column. On mobile it becomes display:contents so
     that #panel and #sheet are laid out against the viewport instead of
     against each other -- a transformed ancestor is the containing block for
     its position:fixed descendants, so the drawer would otherwise drag the
     sheet off-screen with it. */
  #side {
    width: 430px;
    flex: 0 0 430px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #panel { display: flex; flex-direction: column; flex: none; min-height: 0; }
  #sheet { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  #controls { padding: 13px 15px 11px; border-bottom: 1px solid var(--line); }
  .field { margin-bottom: 11px; }
  .field:last-child { margin-bottom: 0; }
  label.cap {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--dim);
    margin-bottom: 5px;
  }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
  .seg button {
    flex: 1;
    padding: 6px 3px;
    font: inherit;
    font-size: 12px;
    background: transparent;
    border: 0;
    border-right: 1px solid var(--line);
    color: var(--dim);
    cursor: pointer;
    white-space: nowrap;
  }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { background: #f4f1eb; }
  .seg button[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
  }
  .row { display: flex; align-items: center; gap: 9px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  .val { font-variant-numeric: tabular-nums; font-size: 12.5px; min-width: 72px; text-align: right; color: var(--dim); }
  input[type=number], input[type=text] {
    font: inherit; font-size: 12.5px; font-variant-numeric: tabular-nums;
    border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px;
    background: var(--panel); color: var(--ink); width: 100%;
  }
  input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .btn {
    font: inherit; font-size: 12.5px;
    border: 1px solid var(--line); border-radius: 5px;
    background: var(--panel); color: var(--ink);
    padding: 5px 11px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: #f4f1eb; }
  .btn[aria-busy="true"] { color: var(--dim); }
  .btn.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  /* Latitude, longitude, and the locate button, which is square so the row
     reads as two coordinate boxes and one control. */
  .obs { display: grid; grid-template-columns: 1fr 1fr auto; gap: 7px; }
  /* DEM and AGL: a narrow label in front of each box, the two boxes sharing
     what is left of the width equally. */
  .obs2 {
    display: grid; grid-template-columns: auto 1fr auto 1fr;
    gap: 7px; align-items: center; margin-top: 7px;
  }
  .obs2 label { font-size: 12px; color: var(--dim); }
  .iconbtn {
    display: flex; align-items: center; justify-content: center;
    width: 30px; padding: 0; color: var(--dim);
  }
  .iconbtn:hover { color: var(--ink); }
  .iconbtn.on { background: var(--accent-soft); color: var(--accent); }
  /* The centre dot means the pin is standing on a position fix. The ring is
     the control; the dot is whether it is in use. */
  .iconbtn .fix { display: none; }
  .iconbtn.on .fix { display: block; }
  .hint { font-size: 11.5px; color: var(--dim); margin-top: 5px; }
  /* A two-thumb range. Native <input type=range> has one thumb, and the usual
     trick of stacking two and fighting ::-webkit-slider-thumb pointer-events
     is fragile on touch, so this is a small custom control. */
  .dual { position: relative; height: 20px; margin: 2px 0 0; touch-action: none; }
  .dtrack, .dfill {
    position: absolute; top: 8px; height: 4px; border-radius: 2px;
  }
  .dtrack { left: 0; right: 0; background: var(--line); }
  .dfill { background: var(--accent); }
  .dthumb {
    position: absolute; top: 3px; width: 14px; height: 14px; margin-left: -7px;
    border-radius: 50%; background: var(--accent);
    border: 2px solid var(--panel);
    cursor: ew-resize; outline: none;
  }
  .dthumb:focus-visible { box-shadow: 0 0 0 2px var(--accent-soft); }
  .disclose {
    font: inherit; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--dim); background: none; border: 0; padding: 0; cursor: pointer;
  }
  .disclose::after { content: " ▸"; }
  .disclose[aria-expanded="true"]::after { content: " ▾"; }
  .disclose:hover { color: var(--ink); }
  .vsrow {
    display: grid; grid-template-columns: 46px 1fr 48px auto; gap: 7px;
    align-items: center; margin-top: 7px; font-size: 12.5px; color: var(--dim);
  }
  .vsrow input[type=range] { width: 100%; accent-color: var(--accent); }
  .vsrow input:disabled { opacity: 0.45; }
  .vsval { font-variant-numeric: tabular-nums; text-align: right; }
  .chk { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .chk input { accent-color: var(--accent); }
  .rng { float: right; text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; color: var(--dim); }
  .hint b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }

  #count { font-size: 12px; color: var(--dim); padding: 8px 15px; border-bottom: 1px solid var(--line); }
  #count b { color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---------------- list ---------------- */
  #head, .item {
    display: grid;
    grid-template-columns: 22px minmax(78px, 1fr) 58px 52px 44px 44px 50px;
    gap: 6px;
    padding: 0 11px;
    align-items: center;
  }
  #head {
    position: sticky; top: 0; z-index: 1;
    padding-top: 6px; padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--dim); background: var(--panel);
  }
  #head .n { text-align: right; }
  #head .sortable { cursor: pointer; }
  #head .sortable:hover { color: var(--ink); }
  #head .sortable.on { color: var(--accent); font-weight: 700; }

  #list { overflow-y: auto; flex: 1; min-height: 0; }
  .item {
    padding-top: 6px; padding-bottom: 6px;
    border-bottom: 1px solid #eeeae3;
    cursor: pointer;
    font-size: 12.5px;
  }
  .item:hover { background: #faf7f2; }
  .item.sel { background: var(--accent-soft); }
  .item > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank { font-size: 11px; color: #a89d8c; font-variant-numeric: tabular-nums; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .item .m { font-weight: 600; }
  .item .dim { color: var(--dim); }
  .az { font-weight: 600; }
  .unnamed { color: var(--dim); font-style: italic; }
  .flag { color: var(--accent); }
  #more { padding: 10px 14px; font-size: 12px; color: var(--dim); }
  #credit { flex: none; padding: 8px 15px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--dim); line-height: 1.5; }
  #credit a { color: var(--dim); }

  /* ---------------- resizer + map ---------------- */
  #resizer { flex: 0 0 5px; cursor: col-resize; background: var(--line); }
  #resizer:hover, #resizer.drag { background: var(--accent); }
  #right { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  /* The wrapper owns the layout; the canvas is taken out of flow inside it.
     A canvas is a replaced element, so its width/height ATTRIBUTES are its
     intrinsic size, and a flex item defaults to min-height:auto -- meaning the
     bitmap size becomes a layout floor. Sizing the bitmap from
     devicePixelRatio then grew the element, which fired the ResizeObserver,
     which redrew and grew it again: the strip crept down over the map and the
     map flickered as it was resized every frame. Absolute positioning breaks
     the cycle for good. */
  #panobox {
    flex: 0 0 34%;
    position: relative;
    min-height: 0;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  #pano {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;          /* we handle the drag ourselves */
    cursor: ew-resize;
  }
  #map { flex: 1; min-width: 0; position: relative; }
  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--dim); font-size: 13px; z-index: 5;
  }
  /* ---------------- mobile ---------------- *
   * The map is the page. The table is a desktop affordance -- on a phone it
   * competes with the thing you are actually looking at, so it is gone, not
   * shrunk. Controls live behind the hamburger.
   */
  #burger, #scrim, #listbtn { display: none; }
  @media (max-width: 820px) {
    #side { display: contents; }
    #panel {
      position: fixed; z-index: 20; top: 0; left: 0; bottom: 0;
      background: var(--panel);
      width: min(86vw, 360px); flex: none;
      border-right: 1px solid var(--line);
      transform: translateX(-100%);
      transition: transform 160ms ease-out;
    }
    body.menu #panel { transform: none; }
    #resizer { display: none; }
    #controls { flex: 1; overflow-y: auto; }
    #right { flex: 1; min-height: 0; }
    /* On a phone the strip sits over the bottom of the map rather than
       stealing a third of it -- the map is what you are navigating. */
    #panobox {
      position: fixed; z-index: 17; left: 0; right: 0; bottom: 0;
      height: 32vh; flex: none;
      border-top: 1px solid var(--line); border-bottom: 0;
    }
    body.list #panobox { display: none; }
    #listbtn { bottom: calc(32vh + 12px); }

    /* The table is not the default view on a phone -- the map is -- but it is
       one tap away, as a sheet over the map. The pill doubles as the count, so
       it says something useful while closed.

       count and list are wrapped in #sheet and moved together: a percentage
       translate is relative to the element's own height, so translating a
       30 px count bar by 110% moves it 33 px and leaves it on the map. */
    #sheet {
      display: flex; flex-direction: column;
      position: fixed; z-index: 18; left: 0; right: 0; bottom: 0; height: 62vh;
      background: var(--panel); border-top: 1px solid var(--line);
      transform: translateY(100%);
      transition: transform 160ms ease-out;
    }
    #count { flex: none; }
    #list { flex: 1; min-height: 0; }
    body.list #sheet { transform: none; }
    /* the pill floats over the sheet, so keep the last rows clear of it */
    body.list #rows { padding-bottom: 46px; }
    #listbtn {
      display: block; position: fixed; z-index: 21; left: 10px; bottom: 12px;
      padding: 8px 13px; font: inherit; font-size: 12.5px;
      font-variant-numeric: tabular-nums;
      background: var(--panel); color: var(--ink);
      border: 1px solid var(--line); border-radius: 5px; cursor: pointer;
    }
    body.list #listbtn { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    #credit { display: none; }
    #burger {
      display: flex; align-items: center; justify-content: center;
      position: fixed; z-index: 21; top: 10px; left: 10px;
      width: 38px; height: 38px; padding: 0;
      background: var(--panel); border: 1px solid var(--line); border-radius: 5px;
      color: var(--ink); cursor: pointer;
    }
    #burger span, #burger span::before, #burger span::after {
      display: block; width: 17px; height: 1.5px; background: var(--ink); content: "";
      position: relative;
    }
    #burger span::before { top: -5px; position: absolute; }
    #burger span::after { top: 5px; position: absolute; }
    body.menu #burger { left: calc(min(86vw, 360px) + 10px); }
    body.menu #scrim {
      display: block; position: fixed; inset: 0; z-index: 19;
      background: rgba(43, 39, 35, 0.22);
    }
    /* A tap that lands on the map should pan it, not teleport the observer;
       moving the pin on a phone is a deliberate drag. */
  }
</style>
</head>
<body>

<button id="burger" aria-label="Controls" aria-expanded="false"><span></span></button>
<div id="scrim"></div>
<button id="listbtn" aria-expanded="false"></button>

<div id="side">
<div id="panel">
  <div id="controls">
    <div class="field">
      <div class="obs">
        <input type="text" id="olat" value="60.15530" title="latitude">
        <input type="text" id="olon" value="24.95350" title="longitude">
        <button id="locate" class="btn iconbtn" aria-label="Use my location"
                aria-pressed="false" title="Use my location">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"
               fill="none" stroke="currentColor" stroke-width="1.7">
            <circle cx="12" cy="12" r="6.4"/>
            <path d="M12 1.6v4M12 18.4v4M1.6 12h4M18.4 12h4" stroke-linecap="round"/>
            <circle class="fix" cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/>
          </svg>
        </button>
      </div>
      <div class="obs2">
        <label for="odem">DEM:</label>
        <input type="number" id="odem" value="0" step="1"
               title="ground elevation under the observer, metres N2000">
        <label for="oagl">AGL:</label>
        <input type="number" id="oagl" value="20" step="1"
               title="eye height above that ground, metres">
      </div>
    </div>

    <div class="field">
      <label class="cap">Terrain</label>
      <div class="hint" id="thint" style="margin-top:0">&nbsp;</div>
    </div>

    <div class="field">
      <label class="cap">Show</label>
      <div class="seg" id="seg-cat">
        <button data-v="all" aria-pressed="true">All</button>
        <button data-v="mast" aria-pressed="false">Masts</button>
        <button data-v="chimney" aria-pressed="false">Stacks</button>
        <button data-v="turbine" aria-pressed="false">Turbines</button>
        <button data-v="tower" aria-pressed="false">Towers</button>
      </div>
    </div>

    <div class="field">
      <label class="cap">Distance <span id="dist-val" class="rng">0 &ndash; 60 km</span></label>
      <div class="dual" id="dist">
        <div class="dtrack"></div>
        <div class="dfill" id="dfill"></div>
        <div class="dthumb" id="dlo" tabindex="0" role="slider" aria-label="Minimum distance"></div>
        <div class="dthumb" id="dhi" tabindex="0" role="slider" aria-label="Maximum distance"></div>
      </div>
    </div>

    <div class="field">
      <label class="cap" for="minang">Minimum apparent height</label>
      <div class="row">
        <input type="range" id="minang" min="0" max="60" step="1" value="9">
        <span class="val" id="minang-val">0.15&deg;</span>
      </div>
    </div>

    <div class="field">
      <button class="disclose" id="vs-toggle" aria-expanded="false">Vertical scale</button>
      <div id="vs" hidden>
        <div class="vsrow">
          <span>Top</span>
          <input type="range" id="alttop" min="0" max="1000" step="1">
          <span class="vsval" id="alttop-val">&nbsp;</span>
          <label class="chk"><input type="checkbox" id="alttopauto" checked> Auto</label>
        </div>
        <div class="vsrow">
          <span>Bottom</span>
          <input type="range" id="altbot" min="0" max="1000" step="1">
          <span class="vsval" id="altbot-val">&nbsp;</span>
          <label class="chk"><input type="checkbox" id="altbotauto" checked> Auto</label>
        </div>
      </div>
    </div>

    <div class="field">
      <label class="cap">Only</label>
      <div class="seg" id="seg-vis">
        <button data-v="horizon" aria-pressed="true">Above horizon</button>
        <button data-v="named" aria-pressed="false">Named</button>
        <button data-v="none" aria-pressed="false">No filter</button>
      </div>
    </div>
  </div>

</div>

<div id="sheet">
  <div id="count">&nbsp;</div>
  <div id="list">
    <div id="head">
      <div>#</div>
      <div>Object</div>
      <div class="n sortable on" data-m="az">Az &deg;T</div>
      <div class="n sortable" data-m="dist">Dist</div>
      <div class="n sortable" data-m="top">Top</div>
      <div class="n sortable" data-m="height">H</div>
      <div class="n sortable" data-m="alt">Alt &deg;</div>
    </div>
    <div id="rows"></div>
  </div>
</div>
<div id="credit"></div>
</div>

<div id="resizer" title="Drag to resize"></div>

<div id="right">
  <div id="panobox"><canvas id="pano"></canvas></div>
  <div id="map"><div id="loading">Loading objects&hellip;</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.min.js"></script>
<script>
/* ------------------------------------------------------------------ *
 * Geodesy. Azimuth is the whole point of this page, so it is computed
 * on the ellipsoid: Vincenty inverse on GRS80. The cheaper options are
 * not good enough -- from Helsinki, a spherical great circle is off by
 * a systematic 0.048 deg at this latitude, and an equirectangular
 * approximation by 1.55 deg at 200 km. Measured cost is about half a
 * microsecond per pair, so 16k objects is ~10 ms.
 * ------------------------------------------------------------------ */
const A = 6378137.0, F = 1 / 298.257222101, B = A * (1 - F);
const D2R = Math.PI / 180, R2D = 180 / Math.PI;

function inverse(lat1, lon1, lat2, lon2) {
  const L = (lon2 - lon1) * D2R;
  const U1 = Math.atan((1 - F) * Math.tan(lat1 * D2R));
  const U2 = Math.atan((1 - F) * Math.tan(lat2 * D2R));
  const sU1 = Math.sin(U1), cU1 = Math.cos(U1);
  const sU2 = Math.sin(U2), cU2 = Math.cos(U2);
  let lam = L, sl, cl, ss, cs, sig, sa, c2a, c2sm, C, prev;
  for (let i = 0; i < 100; i++) {
    sl = Math.sin(lam); cl = Math.cos(lam);
    ss = Math.hypot(cU2 * sl, cU1 * sU2 - sU1 * cU2 * cl);
    if (ss === 0) return { d: 0, az: 0 };
    cs = sU1 * sU2 + cU1 * cU2 * cl;
    sig = Math.atan2(ss, cs);
    sa = cU1 * cU2 * sl / ss;
    c2a = 1 - sa * sa;
    c2sm = c2a !== 0 ? cs - 2 * sU1 * sU2 / c2a : 0;
    C = F / 16 * c2a * (4 + F * (4 - 3 * c2a));
    prev = lam;
    lam = L + (1 - C) * F * sa * (sig + C * ss * (c2sm + C * cs * (-1 + 2 * c2sm * c2sm)));
    if (Math.abs(lam - prev) < 1e-12) break;
  }
  const u2 = c2a * (A * A - B * B) / (B * B);
  const Ac = 1 + u2 / 16384 * (4096 + u2 * (-768 + u2 * (320 - 175 * u2)));
  const Bc = u2 / 1024 * (256 + u2 * (-128 + u2 * (74 - 47 * u2)));
  const dsig = Bc * ss * (c2sm + Bc / 4 * (cs * (-1 + 2 * c2sm * c2sm)
    - Bc / 6 * c2sm * (-3 + 4 * ss * ss) * (-3 + 4 * c2sm * c2sm)));
  const az = Math.atan2(cU2 * sl, cU1 * sU2 - sU1 * cU2 * cl) * R2D;
  return { d: B * Ac * (sig - dsig), az: (az + 360) % 360 };
}

/* Earth curvature with standard refraction. k = 0.13 gives an effective
   radius of 7,323 km. Refraction is the dominant term at range: swinging
   k from 0.07 to 0.25 moves a 100 km object by 291 arcseconds, which is
   most of a 327 m mast's own angular height at that distance. */
const K = 0.13, REFF = 6371008.8 / (1 - K);

const fmt = (n, p) => n == null ? '–' : n.toFixed(p == null ? 1 : p);

/* ------------------------------------------------------------------ */

/* eye is AGL: the eye's height above the ground it stands on, never above
   sea level. The AGL box edits it directly.
   dem is a ground elevation the user typed, in metres N2000, and demAt the
   position it was typed at -- an elevation belongs to a place, so moving the
   pin retires it. fixAt is the position geolocation last reported, which is
   how the locate button knows whether its fix is still the one in use. */
const STATE = {
  lat: 60.15530, lon: 24.95350, eye: 20, dem: null, demAt: null, fixAt: null,
  cat: 'all', mind: 0, maxd: 60, minang: 0.15, vis: 'horizon',
  sort: 'az', sel: null
};
const MAX_ROWS = 500;
let OBJECTS = [], META = {}, view = [];

/* Distance is drawn as aerial perspective: near objects in deep rust,
   far ones fading to pale sand. It is the same ramp the sibling map uses
   for height, read the other way round, so both pages share a palette. */
const SHADES = ['#7d2b12', '#b4531d', '#cd7f3c', '#dda866', '#e7c89a', '#efe4d2'];
const DSTOPS = [0, 8, 20, 40, 80, 150];
function distColor(km) {
  for (let i = DSTOPS.length - 1; i >= 0; i--) if (km >= DSTOPS[i]) return SHADES[i];
  return SHADES[0];
}

const CATLABEL = {
  mast: 'mast', chimney: 'stack', turbine: 'turbine', watertower: 'water tower',
  obstower: 'tower', belltower: 'bell tower', lighthouse: 'lighthouse', building: 'building'
};
const TOWERISH = new Set(['obstower', 'watertower', 'belltower', 'lighthouse', 'building']);
/* Categories whose generic fallback label is not worth the pixels in the
   horizon strip. "building" against a skyline of buildings says nothing, and
   unnamed buildings outnumber every other category put together, so they were
   crowding out labels that do identify something. They keep their cap, their
   line and their table row -- only the label is dropped. */
const NOLABEL = new Set(['building']);

const map = new maplibregl.Map({
  container: 'map',
  /* OpenFreeMap's "positron" -- vector, no API key, no usage cap, and already
     a pale grey, so the app's own colour is the only colour on the page.
     NOT tile.openstreetmap.org: their tile usage policy forbids an app like
     this, and in practice the browser gets 0-byte responses while curl gets
     200, so it fails silently rather than loudly. The self-hosted PMTiles
     archive in PLAN.md 3.6 replaces this when the terrain work lands. */
  style: 'https://tiles.openfreemap.org/styles/positron',
  center: [STATE.lon, STATE.lat],
  zoom: 8.4,
  maxZoom: 17
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
map.addControl(new maplibregl.ScaleControl({ maxWidth: 110 }));
new ResizeObserver(() => map.resize()).observe(document.getElementById('map'));

const marker = new maplibregl.Marker({ color: '#b4531d', draggable: true })
  .setLngLat([STATE.lon, STATE.lat]).addTo(map);
marker.on('dragend', () => {
  const p = marker.getLngLat();
  STATE.lat = p.lat; STATE.lon = p.lng;
  syncInputs(); recompute();
});

/* Start the download immediately rather than inside map 'load': a map in a
   hidden or zero-size container never fires it, which would stall the fetch
   indefinitely. */
const dataPromise = fetch('objects.json')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });

dataPromise.then(d => {
  META = d;
  OBJECTS = d.objects;
  const l = document.getElementById('loading');
  if (l) l.remove();
  document.getElementById('credit').innerHTML =
    (d.attribution || []).map(esc).join(' &middot; ') +
    ' &middot; data ' + esc(d.licence || '') + ', generated ' + esc(d.generated || '');
  recompute();
}).catch(() => {
  const l = document.getElementById('loading');
  if (l) l.textContent = 'Could not load objects.json — run: python build.py build';
});

/* Set the layers up when the STYLE is parsed, not when the map is fully
   loaded. 'load' waits for a first complete render, so a basemap that fails
   to fetch means it never fires and none of the app's own layers are ever
   added -- the map then sits there empty with no error. */
let layersReady = false;
async function addAppLayers() {
  if (layersReady) return;
  layersReady = true;
  try { await dataPromise; } catch (e) { return; }

  /* Under the basemap's labels, so place names stay legible on top of the
     object dots instead of being buried by them. */
  const firstLabel = (map.getStyle().layers.find(l => l.type === 'symbol') || {}).id;

  /* Positron paints water pale blue. Repaint it, and the water labels, into
     the warm neutral the rest of the page uses -- the accent should be the
     only colour on the screen. */
  for (const l of map.getStyle().layers) {
    const id = l.id.toLowerCase();
    if (!/water|ocean|sea|river|lake/.test(id)) continue;
    try {
      if (l.type === 'fill') map.setPaintProperty(l.id, 'fill-color', '#e4e0d8');
      else if (l.type === 'line') map.setPaintProperty(l.id, 'line-color', '#dad5cb');
      else if (l.type === 'symbol') map.setPaintProperty(l.id, 'text-color', '#9a9083');
    } catch (e) { /* a style can rename its layers under us; not fatal */ }
  }

  map.addSource('objs', { type: 'geojson', data: empty() });
  map.addSource('rings', { type: 'geojson', data: empty() });
  map.addSource('ray', { type: 'geojson', data: empty() });
  map.addSource('wedge', { type: 'geojson', data: empty() });

  /* The azimuth window, as a filled wedge. Drawn under everything else so
     it tints the map rather than hiding it. */
  map.addLayer({
    id: 'wedge', type: 'fill', source: 'wedge',
    paint: { 'fill-color': '#b4531d', 'fill-opacity': 0.09 }
  }, firstLabel);
  map.addLayer({
    id: 'wedge-line', type: 'line', source: 'wedge',
    paint: { 'line-color': '#b4531d', 'line-width': 1, 'line-opacity': 0.45 }
  }, firstLabel);

  map.addLayer({
    id: 'rings', type: 'line', source: 'rings',
    paint: { 'line-color': '#a89d8c', 'line-width': 1, 'line-dasharray': [3, 3], 'line-opacity': 0.7 }
  }, firstLabel);
  map.addLayer({
    id: 'ray', type: 'line', source: 'ray',
    paint: { 'line-color': '#1c1917', 'line-width': 1.6 }
  }, firstLabel);
  map.addLayer({
    id: 'objs', type: 'circle', source: 'objs',
    /* Tallest-apparent on top, so a landmark is never buried under the
       cluster of turbines in front of it. */
    layout: { 'circle-sort-key': ['get', 'alt'] },
    paint: {
      'circle-color': ['get', 'color'],
      'circle-radius': ['interpolate', ['linear'], ['get', 'ang'], 0.1, 3, 1, 6, 5, 11],
      'circle-opacity': 0.9,
      'circle-stroke-width': ['case', ['get', 'issel'], 2, 0],
      'circle-stroke-color': '#1c1917'
    }
  }, firstLabel);

  map.on('click', 'objs', e => select(OBJECTS[e.features[0].properties.i], false));
  map.on('mouseenter', 'objs', () => map.getCanvas().style.cursor = 'pointer');
  map.on('mouseleave', 'objs', () => map.getCanvas().style.cursor = '');
  map.on('click', e => {
    // Click-to-move is a desktop affordance. On a phone the same gesture is
    // how you pan, so the pin moves only by a deliberate drag.
    if (NARROW()) return;
    if (map.queryRenderedFeatures(e.point, { layers: ['objs'] }).length) return;
    STATE.lat = e.lngLat.lat; STATE.lon = e.lngLat.lng;
    marker.setLngLat(e.lngLat); syncInputs(); recompute();
  });

  paint();
  syncRay();
}

if (map.isStyleLoaded()) addAppLayers();
else map.once('styledata', addAppLayers);
map.on('error', e => {
  const m = (e && e.error && e.error.message) || '';
  if (/tile|source/i.test(m)) console.warn('basemap:', m);
});

const empty = () => ({ type: 'FeatureCollection', features: [] });
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ------------------------------------------------------------------ *
 * Terrain.
 *
 * horizon.js does the work in a Worker: it decodes the AZT1 tiles, reads the
 * observer's own ground out of the finest one, and ray-casts 3600 azimuths
 * into a horizon profile. What comes back is
 *
 *   prof[b]   the horizon elevation, degrees, at azimuth b*0.1
 *   profD[b]  how far away the terrain that sets it is
 *   off/stD/stA   a monotone staircase of (distance, elevation) per bin
 *
 * The staircase is the part that matters for occlusion. prof[b] is a maximum
 * over the whole 90 km ray, so testing an object against it hides a 60 m
 * building at 3 km behind a 120 m hill 22 km BEHIND IT. hzAt() asks the
 * staircase for the horizon within r < d instead, which is the real question.
 * Counted at the default pin, out to 60 km: the profile alone would call
 * 1,341 objects hidden, the staircase calls 1,127, so 221 of them -- one in
 * six -- are things you can actually see, wrongly buried by terrain standing
 * behind them.
 * ------------------------------------------------------------------ */

const HZ = {
  worker: null, err: null, failed: null,
  key: null, posKey: null, pending: null, fetching: null, t0: 0, wall: 0,
  ground: null,
  prof: null, profD: null, off: null, stD: null, stA: null,
  stats: null, hidden: 0
};

const hzPos = () => STATE.lat.toFixed(6) + '/' + STATE.lon.toFixed(6);
/* Four fields, always four, so splitting on the slash stays unambiguous: the
   two coordinates, the eye height, and the DEM override or "-" for none. The
   override has to be in the key or a changed DEM would be answered out of the
   cache with a profile swept from a different observer elevation. */
const hzKey = () => hzPos() + '/' + STATE.eye + '/' + (demTyped() == null ? '-' : demTyped());

/* The observer's ground elevation, by one rule, used everywhere:
     1. a DEM typed for THIS position wins;
     2. else the terrain model's reading of the tile the observer stands on;
     3. else 0 m N2000 -- sea level, the only defensible number when nothing
        knows better.
   The old fallback here was the median base elevation of objects within 10 km.
   It was one number for a whole neighbourhood, could not see a hill, and at
   the default pin read 10.5 m against the tile's 8.0; on the crown of
   Tahtitorninmaki 690 m north it still read 11.2 while the ground had risen to
   32 m. A 21 m observer error is 0.12 degrees at 10 km, on every object at
   once, so it is gone rather than hidden. */
const demTyped = () => (STATE.dem != null && STATE.demAt === hzPos()) ? STATE.dem : null;
function groundNow() {
  const d = demTyped();
  if (d != null) return d;
  if (HZ.ground != null && HZ.posKey === hzPos()) return HZ.ground;
  return 0;
}

/* Show the reader what the effective ground is, except while it is their own
   typed number -- reformatting someone's input under their cursor is rude. */
function syncGround() {
  /* Retire an override the pin has walked away from, rather than leaving it
     parked in STATE to reappear if the pin ever lands on that exact spot
     again. The resolution rule ignores it either way; this is the discard. */
  if (STATE.dem != null && STATE.demAt !== hzPos()) { STATE.dem = null; STATE.demAt = null; }
  if (demTyped() != null) return;
  const g = groundNow();
  document.getElementById('odem').value =
    Number.isInteger(g) ? String(g) : g.toFixed(1);
}

try {
  HZ.worker = new Worker('horizon.js');
  HZ.worker.onmessage = e => {
    const m = e.data;
    if (m.stage === 'tiles') {
      if (m.id === HZ.pending) { HZ.fetching = [m.done, m.want]; thint(); }
      return;
    }
    if (m.id !== HZ.pending) return;            // an answer for a place we left
    HZ.pending = null; HZ.fetching = null;
    if (!m.ok) {
      HZ.err = m.error; HZ.prof = null; HZ.key = null; HZ.failed = m.id;
      thint(); recompute();
      return;
    }
    HZ.err = null; HZ.failed = null;
    HZ.key = m.id;
    HZ.posKey = m.id.split('/').slice(0, 2).join('/');
    /* What the tile says, not what the sweep ran on: with a DEM override
       those differ, and this field has to survive the override being cleared
       without handing back the override's own number. */
    HZ.ground = m.ground;
    HZ.prof = m.prof; HZ.profD = m.profD;
    HZ.off = m.off; HZ.stD = m.stD; HZ.stA = m.stA;
    HZ.stats = m.stats;
    HZ.wall = performance.now() - HZ.t0;
    recompute();
  };
  HZ.worker.onerror = ev => {
    HZ.err = ev.message || 'horizon.js failed to start';
    HZ.pending = null; HZ.prof = null;
    thint();
  };
} catch (e) {
  HZ.err = String(e && e.message || e);
}

let hzTimer = null;
function hzRequest() {
  if (!HZ.worker) return;
  /* The gate is on the KEY that failed, not on HZ.err. Most of Finland has
     no tiles cached, so the first answer at a new place is often "no terrain
     tile covers the observer"; refusing to ask again after any failure left
     the page with no terrain for the rest of the session once the pin came
     back. But clearing HZ.key on failure and gating on nothing was worse --
     the failure handler calls recompute(), recompute() calls this, and the
     same doomed sweep was queued again forever. Where terrain is not
     published at all that is an endless refetch of a file that will never
     parse. Ask once per place; a new pin is a new question. */
  const key = hzKey();
  if (key === HZ.key || key === HZ.pending || key === HZ.failed) return;
  /* A profile belongs to one place. Keep it across an eye-height change --
     it is a fraction of a degree out for the couple of hundred milliseconds
     the resweep takes -- but throw it away the moment the pin moves, because
     then it is a picture of somewhere else. */
  if (HZ.posKey !== hzPos()) {
    HZ.prof = null; HZ.key = null; HZ.ground = null; HZ.posKey = null;
  }
  clearTimeout(hzTimer);
  hzTimer = setTimeout(() => {
    HZ.pending = key;
    HZ.err = null;
    HZ.t0 = performance.now();
    /* ground goes only when the user typed one. Absent, the worker reads the
       observer's elevation off the tile exactly as it always has; present, it
       sweeps from the typed elevation, so the drawn skyline and the objects'
       geometry cannot be computed from two different observers. */
    const dem = demTyped();
    const msg = { id: key, lat: STATE.lat, lon: STATE.lon, eye: STATE.eye };
    if (dem != null) msg.ground = dem;
    HZ.worker.postMessage(msg);
    thint();
  }, 180);
}

/* The horizon in one bin, restricted to terrain nearer than d metres.
   Binary search for the last breakpoint before d; the staircase is monotone
   in both distance and elevation, so that entry IS the maximum over r < d. */
function hzBin(b, d) {
  const lo = HZ.off[b], hi = HZ.off[b + 1];
  const q = d / 10;                             // stD is in 10 m units
  let a = lo, z = hi;
  while (a < z) { const m = (a + z) >> 1; if (HZ.stD[m] < q) a = m + 1; else z = m; }
  return a > lo ? a - 1 : -1;
}

/* Sub-bin placement, PLAN.md 5.2: the object sits at its analytic azimuth and
   the profile is interpolated between the two rays either side of it. It is
   also what the silhouette is drawn from, so the picture and the test agree
   about whether a top clears a ridge. */
function hzAt(az, d) {
  if (!HZ.prof) return null;
  const f = ((az % 360) + 360) % 360 / 0.1;
  const b0 = Math.floor(f) % 3600, b1 = (b0 + 1) % 3600, t = f - Math.floor(f);
  const i0 = hzBin(b0, d), i1 = hzBin(b1, d);
  const a0 = i0 < 0 ? -90 : HZ.stA[i0] / 100;
  const a1 = i1 < 0 ? -90 : HZ.stA[i1] / 100;
  return a0 + (a1 - a0) * t;
}

/* How far away the terrain that hides it is -- nearest ray only, for the
   readout. */
function hzDistAt(az, d) {
  if (!HZ.prof) return null;
  const b = Math.round(((az % 360) + 360) % 360 / 0.1) % 3600;
  const i = hzBin(b, d);
  return i < 0 ? null : HZ.stD[i] * 10;
}

/* The whole-ray horizon, for the silhouette. */
function hzProf(az) {
  const f = ((az % 360) + 360) % 360 / 0.1;
  const b0 = Math.floor(f) % 3600, t = f - Math.floor(f);
  const a = HZ.prof[b0], b = HZ.prof[(b0 + 1) % 3600];
  return a + (b - a) * t;
}

function thint() {
  const el = document.getElementById('thint');
  if (!el) return;
  if (HZ.err && !HZ.prof) { el.textContent = 'no terrain — ' + HZ.err; return; }
  if (HZ.fetching) {
    el.textContent = 'terrain tiles ' + HZ.fetching[0] + '/' + HZ.fetching[1] + '…';
    return;
  }
  if (HZ.pending) { el.textContent = 'sweeping the horizon…'; return; }
  if (!HZ.stats) { el.innerHTML = '&nbsp;'; return; }
  const s = HZ.stats;
  el.innerHTML = '3,600 rays &middot; <b>' + Math.round(s.msSweep) + ' ms</b> sweep, ' +
    Math.round(s.msFetch) + ' ms tiles &middot; ' + s.tiles + ' tiles' +
    (s.skipped ? ' (' + s.skipped + ' too low to matter)' : '') +
    ' &middot; <b>' + HZ.hidden + '</b> in range hidden by terrain';
}

/* Dip of the sea horizon. It is set by the eye's height above SEA LEVEL, not
   above whatever it is standing on: at the default pin in Kaivopuisto a 20 m
   eye on 8 m of ground is 28 m above the water, and the horizon is 0.1584 deg
   down rather than the 0.1339 the eye height alone gives. That was tolerable
   while the ground elevation was a guess. It is not now, because the
   ray-caster over open water produces exactly -dip -- checked, the profile
   due south reads -0.1584 -- so a dashed line at any other angle would draw
   the sea horizon twice, in two places. */
function dipDeg() {
  return Math.sqrt(2 * Math.max(0.5, groundNow() + STATE.eye) / REFF) * R2D;
}

/* ------------------------------------------------------------------ *
 * Compute.
 * ------------------------------------------------------------------ */

function recompute() {
  if (!OBJECTS.length) return;
  hzRequest();

  syncGround();
  syncLocate();
  const eyeAbs = groundNow() + STATE.eye;

  const maxm = STATE.maxd * 1000;
  const minm = STATE.mind * 1000;
  const dip = dipDeg();
  let hidden = 0;
  const out = [];
  for (let i = 0; i < OBJECTS.length; i++) {
    const o = OBJECTS[i];
    // Cheap planar reject first; the ellipsoidal solution is only worth
    // running for what survives it.
    const dy = (o.lat - STATE.lat) * 111320;
    const dx = (o.lon - STATE.lon) * 111320 * Math.cos(STATE.lat * D2R);
    if (Math.abs(dx) > maxm || Math.abs(dy) > maxm) continue;

    const g = inverse(STATE.lat, STATE.lon, o.lat, o.lon);
    if (g.d > maxm || g.d < Math.max(1, minm)) continue;

    o.i = i;
    o.dist = g.d;
    o.az = g.az;
    if (o.top_m != null) {
      const drop = g.d * g.d / (2 * REFF);
      o.alt = Math.atan2(o.top_m - eyeAbs - drop, g.d) * R2D;
      const base = o.ground_m != null ? o.ground_m : o.top_m - (o.height_m || 0);
      o.altBase = Math.atan2(base - eyeAbs - drop, g.d) * R2D;
      o.ang = Math.max(0, o.alt - o.altBase);        // visible angular height
      /* Visible iff the top clears the land horizon IN FRONT OF IT. With no
         profile that falls back to the geometric sea horizon, which is what
         the page did before the ray-caster: a hill in the way was simply not
         modelled. Note the terrain horizon is never below -dip, because every
         ray sees sea at 0 m N2000 and the sea's own maximum is the dip. */
      o.hor = hzAt(o.az, g.d);
      o.above = o.hor != null ? o.alt > o.hor : o.alt > -dip;
      if (o.hor != null && !o.above) hidden++;
    } else {
      o.alt = null; o.altBase = null; o.ang = null; o.above = null; o.hor = null;
    }
    out.push(o);
  }
  HZ.hidden = hidden;
  thint();
  view = out.filter(pass);
  sortView();
  paint();
  renderList();
  drawPano();
}

function pass(o) {
  if (STATE.cat !== 'all') {
    if (STATE.cat === 'tower' ? !TOWERISH.has(o.cat) : o.cat !== STATE.cat) return false;
  }
  if (STATE.vis === 'named' && !o.name) return false;
  if (STATE.vis === 'horizon' && o.above === false) return false;
  if (STATE.minang > 0) {
    if (o.ang == null) return false;
    if (o.ang < STATE.minang) return false;
  }
  return true;
}

function sortView() {
  const m = STATE.sort;
  const key = {
    az: o => o.az,
    dist: o => o.dist,
    top: o => -(o.top_m == null ? -1e9 : o.top_m),
    height: o => -(o.height_m == null ? -1e9 : o.height_m),
    alt: o => -(o.alt == null ? -1e9 : o.alt)
  }[m];
  view.sort((a, b) => key(a) - key(b));
}

/* ------------------------------------------------------------------ */

function paint() {
  if (!map.getSource || !map.getSource('objs')) return;
  map.getSource('objs').setData({
    type: 'FeatureCollection',
    features: view.slice(0, 4000).map(o => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [o.lon, o.lat] },
      properties: {
        i: o.i, alt: o.alt == null ? -99 : o.alt, ang: o.ang == null ? 0.1 : o.ang,
        color: distColor(o.dist / 1000), issel: o.i === STATE.sel
      }
    }))
  });
  map.getSource('rings').setData({
    type: 'FeatureCollection',
    features: [STATE.mind, 10, 25, 50, 100].filter(km => km > 0 && km <= STATE.maxd)
      .map(km => ({ type: 'Feature', geometry: { type: 'LineString', coordinates: circle(km) } }))
  });
  const s = view.find(o => o.i === STATE.sel);
  map.getSource('ray').setData(s
    ? { type: 'FeatureCollection', features: [{ type: 'Feature',
        geometry: { type: 'LineString', coordinates: [[STATE.lon, STATE.lat], [s.lon, s.lat]] } }] }
    : empty());
}

function circle(km) {
  const pts = [];
  for (let a = 0; a <= 360; a += 3) {
    const br = a * D2R, dr = km * 1000 / 6371008.8;
    const p1 = STATE.lat * D2R, l1 = STATE.lon * D2R;
    const p2 = Math.asin(Math.sin(p1) * Math.cos(dr) + Math.cos(p1) * Math.sin(dr) * Math.cos(br));
    const l2 = l1 + Math.atan2(Math.sin(br) * Math.sin(dr) * Math.cos(p1),
                               Math.cos(dr) - Math.sin(p1) * Math.sin(p2));
    pts.push([l2 * R2D, p2 * R2D]);
  }
  return pts;
}

function renderList() {
  updateCount();
  // On a phone the sheet is usually closed, so skip building 500 rows of DOM
  // on every slider tick; the button builds them when it opens it.
  if (NARROW() && !document.body.classList.contains('list')) return;
  renderRows();
}

function renderRows() {
  const rows = view.slice(0, MAX_ROWS);
  for (const h of document.querySelectorAll('#head .sortable')) {
    h.classList.toggle('on', h.dataset.m === STATE.sort);
  }
  document.getElementById('rows').innerHTML = rows.map((o, i) => {
    const nm = o.name
      ? esc(o.name)
      : '<span class="unnamed">' + CATLABEL[o.cat] + '</span>';
    const est = o.src_h === 'osm' ? '<span class="flag" title="height from OSM">~</span>' : '';
    return '<div class="item' + (o.i === STATE.sel ? ' sel' : '') + '" data-i="' + o.i + '"' +
      ' title="' + esc((o.name || CATLABEL[o.cat]) + ' — ' + o.srcs) + '">' +
      '<div class="rank">' + (i + 1) + '</div>' +
      '<div>' + nm + '</div>' +
      '<div class="num az">' + o.az.toFixed(2) + '</div>' +
      '<div class="num dim">' + (o.dist / 1000).toFixed(1) + '</div>' +
      '<div class="num">' + (o.top_m == null ? '–' : Math.round(o.top_m)) + '</div>' +
      '<div class="num dim">' + (o.height_m == null ? '–' : Math.round(o.height_m)) + est + '</div>' +
      '<div class="num' + (o.alt == null ? ' dim' : '') + '">' +
        (o.alt == null ? '–' : (o.alt >= 0 ? '+' : '') + o.alt.toFixed(2)) + '</div>' +
    '</div>';
  }).join('');

  if (view.length > MAX_ROWS) {
    document.getElementById('rows').insertAdjacentHTML('beforeend',
      '<div id="more">Showing the first ' + MAX_ROWS + ' of ' + view.length.toLocaleString('en') + '.</div>');
  }
  for (const el of document.querySelectorAll('#rows .item')) {
    el.onclick = () => select(OBJECTS[+el.dataset.i], true);
  }
}

function updateCount() {
  const withTop = view.filter(o => o.top_m != null).length;
  document.getElementById('count').innerHTML =
    '<b>' + view.length.toLocaleString('en') + '</b> of ' +
    OBJECTS.length.toLocaleString('en') + ' objects &middot; <b>' + withTop +
    '</b> with a top elevation';
  const lb = document.getElementById('listbtn');
  if (lb) lb.textContent = view.length.toLocaleString('en') + ' objects';
}

function select(o, fly) {
  if (!o) return;
  STATE.sel = o.i;
  PANO.ctr = o.az;
  /* No map popup. It is anchored to the object, so it lands wherever you were
     looking and covers most of the map to say what the strip can say in a
     line. The readout is drawn into the horizon strip instead. */
  paint(); renderList(); drawPano();
  if (fly) map.flyTo({ center: [o.lon, o.lat], speed: 1.2 });
}

/* Compact detail for the selected object, drawn inside the strip.
   Right-hand side: the elevation scale is labelled down the left edge, and a
   plate there covers exactly the numbers you are reading the object against. */
function drawReadout(d, w, h, RULER) {
  const o = view.find(x => x.i === STATE.sel);
  if (!o) return;
  const m = v => v == null ? '–' : Math.round(v) + ' m';
  const lines = [
    o.name || CATLABEL[o.cat],
    'az ' + o.az.toFixed(2) + '°   ' + (o.dist / 1000).toFixed(1) + ' km   alt '
      + (o.alt >= 0 ? '+' : '') + o.alt.toFixed(2) + '°',
    'top ' + m(o.top_m) + '   gnd ' + m(o.ground_m) + '   h ' + m(o.height_m),
  ];
  /* With a profile, say what the horizon in front of this object is and how
     far away it is. That one line is the whole answer to "why is this tower
     not there": Kuningasvuoren vesitorni, 51.7 km north, has its top at
     -0.05 deg and reads "hor +0.33 at 0.7 km" -- Tahtitorninmaki, 690 m
     away, is in the way. */
  if (o.hor != null) {
    const hd = hzDistAt(o.az, o.dist);
    lines.push('hor ' + (o.hor >= 0 ? '+' : '') + o.hor.toFixed(2) + '°'
      + (hd != null ? '  at ' + (hd / 1000).toFixed(1) + ' km' : '')
      + (o.alt <= o.hor ? '   hidden' : ''));
  }
  const F = ['600 12px', '11px', '11px', '11px'];
  const FF = ' -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  let bw = 0;
  lines.forEach((t, i) => { d.font = F[i] + FF; bw = Math.max(bw, d.measureText(t).width); });
  bw += 14;
  const bh = 6 + 14 * lines.length, x0 = Math.max(4, w - bw - 6), y0 = RULER + 5;

  d.fillStyle = 'rgba(255,254,251,0.93)';
  d.fillRect(x0, y0, bw, bh);
  d.strokeStyle = '#b4531d';
  d.lineWidth = 1;
  d.strokeRect(x0 + 0.5, y0 + 0.5, bw - 1, bh - 1);
  d.textAlign = 'left';
  d.textBaseline = 'alphabetic';
  lines.forEach((t, i) => {
    d.font = F[i] + FF;
    d.fillStyle = i === 0 ? '#b4531d' : '#2b2723';
    d.fillText(t, x0 + 7, y0 + 14 + i * 14);
  });
}

/* ------------------------------------------------------------------ *
 * Controls.
 * ------------------------------------------------------------------ */

function seg(id, key, cast) {
  const box = document.getElementById(id);
  box.onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    for (const x of box.querySelectorAll('button')) x.setAttribute('aria-pressed', String(x === b));
    STATE[key] = cast ? cast(b.dataset.v) : b.dataset.v;
    recompute();
  };
}
seg('seg-cat', 'cat');
seg('seg-vis', 'vis');

function slider(id, key, fmtv, cast) {
  const el = document.getElementById(id), out = document.getElementById(id + '-val');
  const upd = () => {
    STATE[key] = cast ? cast(+el.value) : +el.value;
    out.textContent = fmtv(STATE[key]);
  };
  el.oninput = () => { upd(); recompute(); };
  upd();
}
/* Distance, as one control with two thumbs.
   A near cut-off matters because the foreground is where the clutter is: at
   1 km a 30 m shed subtends 1.7 degrees and buries a 327 m mast 40 km behind
   it. Both thumbs share one squared axis, so the first few kilometres -- the
   part actually worth trimming -- get most of the travel, and the far end
   stays coarse where nothing needs excluding. */
const DMAX = 150;
const t2km = t => { const v = DMAX * t * t; return v < 10 ? Math.round(v * 10) / 10 : Math.round(v); };
const km2t = km => Math.sqrt(Math.max(0, km) / DMAX);
const fmtKm = v => v < 10 ? v.toFixed(1) : String(Math.round(v));

const dual = document.getElementById('dist');
const dfill = document.getElementById('dfill');
const dlo = document.getElementById('dlo');
const dhi = document.getElementById('dhi');

function distDraw() {
  const lo = km2t(STATE.mind) * 100, hi = km2t(STATE.maxd) * 100;
  dlo.style.left = lo + '%';
  dhi.style.left = hi + '%';
  dfill.style.left = lo + '%';
  dfill.style.width = (hi - lo) + '%';
  document.getElementById('dist-val').textContent =
    (STATE.mind ? fmtKm(STATE.mind) : '0') + ' – ' + fmtKm(STATE.maxd) + ' km';
  for (const [el, v] of [[dlo, STATE.mind], [dhi, STATE.maxd]]) {
    el.setAttribute('aria-valuenow', String(v));
    el.setAttribute('aria-valuetext', fmtKm(v) + ' km');
  }
}

function distSet(which, km) {
  if (which === 'lo') STATE.mind = Math.max(0, Math.min(km, STATE.maxd - 1));
  else STATE.maxd = Math.max(STATE.mind + 1, Math.min(km, DMAX));
  distDraw();
  recompute();
}

(function () {
  let drag = null;
  const tAt = clientX => {
    const r = dual.getBoundingClientRect();
    return Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  };
  dual.addEventListener('pointerdown', e => {
    const t = tAt(e.clientX);
    // grab whichever thumb is nearer, so a tap on the track moves the sensible one
    drag = Math.abs(t - km2t(STATE.mind)) <= Math.abs(t - km2t(STATE.maxd)) ? 'lo' : 'hi';
    dual.setPointerCapture(e.pointerId);
    distSet(drag, t2km(t));
    e.preventDefault();
  });
  dual.addEventListener('pointermove', e => { if (drag) distSet(drag, t2km(tAt(e.clientX))); });
  const stop = () => { drag = null; };
  dual.addEventListener('pointerup', stop);
  dual.addEventListener('pointercancel', stop);

  for (const [el, which] of [[dlo, 'lo'], [dhi, 'hi']]) {
    el.addEventListener('keydown', e => {
      const step = e.shiftKey ? 10 : 1;
      const cur = which === 'lo' ? STATE.mind : STATE.maxd;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') distSet(which, cur - step);
      else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') distSet(which, cur + step);
      else return;
      e.preventDefault();
    });
  }
})();
distDraw();

/* Minimum apparent height. This registration was lost when the distance
   control replaced the two range inputs, which left the slider moving with
   nothing attached to it. */
slider('minang', 'minang', v => v.toFixed(2) + '°', v => v / 60);

function syncInputs() {
  document.getElementById('olat').value = STATE.lat.toFixed(5);
  document.getElementById('olon').value = STATE.lon.toFixed(5);
}
for (const [id, key] of [['olat', 'lat'], ['olon', 'lon'], ['oagl', 'eye']]) {
  document.getElementById(id).onchange = e => {
    const v = parseFloat(e.target.value.replace(',', '.'));
    if (!isFinite(v)) { syncInputs(); return; }
    STATE[key] = v;
    if (key !== 'eye') {
      marker.setLngLat([STATE.lon, STATE.lat]);
      map.easeTo({ center: [STATE.lon, STATE.lat] });
    }
    recompute();
  };
}

/* The DEM box, which is both a readout and an override. Emptying it hands the
   question back to the terrain model. The typed value is pinned to the
   position it was typed at, so an AGL change keeps it and a moved pin does
   not -- the resolution rule does that part; this only records where. */
document.getElementById('odem').onchange = e => {
  const s = e.target.value.trim().replace(',', '.');
  const v = parseFloat(s);
  if (!isFinite(v)) {
    STATE.dem = null; STATE.demAt = null;
    syncGround();
  } else {
    STATE.dem = v; STATE.demAt = hzPos();
  }
  recompute();
};

/* Geolocation.
 *
 * Position only. The compass is deliberately absent (PLAN.md 11.1) but knowing
 * WHERE you are is a different problem from knowing which way you face, and on
 * a phone typing coordinates is miserable.
 *
 * Three things this deliberately does not do:
 *  - it never reads coords.altitude. The W3C spec says ellipsoidal, Android
 *    obeys, and WebKit returns CLLocation.altitude, which Apple documents as
 *    mean sea level. The two platforms therefore disagree by the geoid
 *    separation, 17.6 m in Helsinki. Ground and eye height stay typed numbers.
 *  - it does not treat coords.accuracy as a standard deviation. The spec
 *    defines it as a 95% radius, so it is roughly 2 sigma.
 *  - it does not watch continuously by default. You stand still on a tower,
 *    and a watch costs battery for nothing.
 *
 * The button carries no text, so everything it has to say goes in the title:
 * the accuracy, and any failure. The alternative was a visible line of its
 * own, which is the line this panel just lost.
 */
const locBtn = document.getElementById('locate');
let watchId = null, lastAcc = null, geoFail = null;

/* Position error matters most for NEAR objects: it is an angle divided by
   range, so 10 m is 0.57 deg at 1 km and 0.01 deg at 50 km. Quote the range
   inside which this fix is the dominant error rather than a bare radius. */
function accText(m) {
  const rms = m / 2;                       // 95% radius -> ~1 sigma
  const km = (rms / Math.tan(0.1 * D2R)) / 1000;
  return '±' + Math.round(m) + ' m (95%), dominates inside ~'
    + (km < 10 ? km.toFixed(1) : Math.round(km)) + ' km';
}

/* The dot is on when the pin is still standing where geolocation put it.
   Dragging it away, or typing coordinates, is the user saying otherwise, and
   no map handler has to know about this button for that to work. */
function syncLocate() {
  const on = STATE.fixAt != null && STATE.fixAt === hzPos();
  locBtn.classList.toggle('on', on);
  locBtn.setAttribute('aria-pressed', watchId != null ? 'true' : 'false');
  /* A disabled or failed button is already saying something in its title;
     don't overwrite it with the idle text. */
  if (locBtn.disabled || locBtn.hasAttribute('aria-busy')) return;
  if (!on) { locBtn.title = geoFail || 'Use my location'; return; }
  locBtn.title = (watchId != null ? 'Following your position' : 'Your position')
    + (lastAcc == null ? '' : ' — ' + accText(lastAcc))
    + (watchId != null ? '' : '. Double-click to follow');
}

function gotPosition(pos) {
  STATE.lat = pos.coords.latitude;
  STATE.lon = pos.coords.longitude;
  STATE.fixAt = hzPos();
  lastAcc = pos.coords.accuracy;
  geoFail = null;
  syncInputs();
  marker.setLngLat([STATE.lon, STATE.lat]);
  map.easeTo({ center: [STATE.lon, STATE.lat], zoom: Math.max(map.getZoom(), 11) });
  locBtn.removeAttribute('aria-busy');
  syncLocate();
  recompute();
}

function geoError(err) {
  locBtn.removeAttribute('aria-busy');
  /* The old message here named a command and a port to run the page over
     https. That was one machine's recipe, and meaningless on a hosted site;
     what the browser is actually insisting on is a secure context. */
  geoFail =
    err.code === err.PERMISSION_DENIED
      ? (window.isSecureContext
          ? 'Location permission denied'
          : 'Location needs a secure (https) connection')
      : err.code === err.POSITION_UNAVAILABLE ? 'Position unavailable'
      : err.code === err.TIMEOUT ? 'Location timed out — try again outdoors'
      : 'Geolocation failed';
  syncLocate();
}

if (!('geolocation' in navigator)) {
  locBtn.disabled = true;
  locBtn.title = 'Geolocation is not available in this browser';
} else {
  locBtn.onclick = () => {
    if (watchId != null) {                 // second press stops following
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      STATE.fixAt = null;
      syncLocate();
      return;
    }
    if (!window.isSecureContext) {
      geoFail = 'Location needs a secure (https) connection';
      syncLocate();
      return;
    }
    geoFail = null;
    locBtn.setAttribute('aria-busy', 'true');
    locBtn.title = 'Locating…';
    const opts = { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 };
    navigator.geolocation.getCurrentPosition(gotPosition, geoError, opts);
  };
  /* Long-press, or double-click on a desktop, to keep following. Useful while
     walking to the spot; pointless once you are standing on it. */
  locBtn.ondblclick = () => {
    if (watchId != null || !window.isSecureContext) return;
    watchId = navigator.geolocation.watchPosition(gotPosition, geoError,
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 2000 });
    syncLocate();
  };
}

document.getElementById('head').onclick = e => {
  const h = e.target.closest('.sortable');
  if (!h) return;
  STATE.sort = h.dataset.m;
  sortView(); renderList();
};

/* ------------------------------------------------------------------ *
 * The horizon strip.
 *
 * x is true azimuth, y is apparent elevation angle -- the same pair of
 * axes as an alt-azimuth grid over a sky photograph, so the two can be
 * compared directly.
 *
 * Objects are drawn from closed-form geodesy and are never ray-cast:
 * at 30 km a 3 m mast column subtends 20.6 arcseconds against a 0.1
 * degree bin's 360, so a raster would either lose it or draw it 17x
 * too wide. The terrain behind and in front of them is the ray-cast
 * part, and it arrives from horizon.js as a 3600-bin profile.
 * ------------------------------------------------------------------ */

const PANO = {
  ctr: 0,            // centre azimuth, degrees
  /* A phone gets a narrower window: 120 degrees across 375 px is about
     3 px per degree, which is not enough to separate two masts, let alone
     label them. Widened by hand with a pinch or the wheel. */
  span: window.matchMedia('(max-width: 820px)').matches ? 45 : 120,
  spanAuto: true,    // until the user zooms
  altMin: -2.0,
  altMax: 7.0,
  topAuto: true,
  botAuto: true,
  hover: null
};

const cv = document.getElementById('pano');
const cx2 = cv.getContext('2d');

function panoSize() {
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(r.width * dpr) || cv.height !== Math.round(r.height * dpr)) {
    cv.width = Math.round(r.width * dpr);
    cv.height = Math.round(r.height * dpr);
  }
  return { w: r.width, h: r.height, dpr };
}

/* Shortest signed angular difference, so the window works across 0/360.
   Without this a window centred on north silently shows nothing. */
const dAz = (a, b) => ((a - b + 540) % 360) - 180;

/* Fit the vertical range to the window.
   The top follows the HIGHEST object, not a percentile. Using p98 meant that
   standing next to a tall mast -- where that mast is the single outlier -- cut
   it off and scaled the view to the couple of degrees everything else occupies;
   the whole mast only appeared once the azimuth window narrowed enough for it
   to stop being an outlier. The bottom does not follow object bases, because a
   tower 500 m away has its foot at -3 degrees and would drag the scale down
   over nothing worth seeing; it sits a little below the horizon instead.
   Either edge can be pinned by hand. */
function fitAlt() {
  const half = PANO.span / 2;
  const dip = dipDeg();
  let hi = null;
  for (const o of view) {
    if (o.alt == null) continue;
    if (Math.abs(dAz(o.az, PANO.ctr)) > half) continue;
    if (hi == null || o.alt > hi) hi = o.alt;
  }
  /* The land counts too, and it has to: a hill in the window is higher than
     everything it hides, so fitting to objects alone would put the skyline
     off the top of the strip with nothing under it. At Kaivopuisto this
     changes nothing -- the whole profile spans -0.16 to +0.33 degrees -- but
     an observer at the foot of a slope is a different picture. */
  if (HZ.prof) {
    for (let k = Math.floor((PANO.ctr - half) * 10); k <= Math.ceil((PANO.ctr + half) * 10); k++) {
      const v = HZ.prof[((k % 3600) + 3600) % 3600];
      if (hi == null || v > hi) hi = v;
    }
  }
  if (PANO.topAuto) {
    PANO.altMax = hi == null ? 1.2 : Math.max(0.6, hi + Math.max(0.12, hi * 0.12));
  }
  if (PANO.botAuto) {
    PANO.altMin = -Math.max(0.3, dip * 2.5);
  }
  if (PANO.altMax - PANO.altMin < 0.15) PANO.altMax = PANO.altMin + 0.15;
}

function drawPano() {
  fitAlt();
  const { w, h, dpr } = panoSize();
  cx2.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx2.clearRect(0, 0, w, h);
  if (!w || !h) return;

  const half = PANO.span / 2;
  const X = az => w * (0.5 + dAz(az, PANO.ctr) / PANO.span);
  const Y = alt => h * (PANO.altMax - alt) / (PANO.altMax - PANO.altMin);

  const RULER = 20;                       // azimuth ruler band at the top
  const dip = dipDeg();

  cx2.fillStyle = '#f7f6f3';              // sky is paper, not blue
  cx2.fillRect(0, 0, w, h);

  /* Ground starts at the TRUE horizon (0 minus the dip), not at eye level.
     Filling from 0 put the shading a dip's worth too high and made the two
     lines harder to tell apart, not easier. */
  const yH = Y(0);
  const yD = Y(-dip);
  cx2.fillStyle = '#efe9df';
  cx2.fillRect(0, yD, w, h - yD);

  /* --- elevation grid --- */
  cx2.strokeStyle = '#e6e0d6';
  cx2.lineWidth = 1;
  cx2.fillStyle = '#a89d8c';
  cx2.font = '10px -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  cx2.textAlign = 'left';
  cx2.textBaseline = 'middle';
  const rng = PANO.altMax - PANO.altMin;
  const stepAlt = rng > 24 ? 10 : rng > 12 ? 5 : rng > 5 ? 1 : rng > 2 ? 0.5 : 0.2;
  const gridY = [];
  for (let k = Math.ceil(PANO.altMin / stepAlt); k * stepAlt <= PANO.altMax; k++) {
    const a = k * stepAlt;
    if (Math.abs(a) < 1e-9) continue;
    const y = Y(a);
    if (y < RULER) continue;
    cx2.beginPath(); cx2.moveTo(0, y + 0.5); cx2.lineTo(w, y + 0.5); cx2.stroke();
    gridY.push([a, y]);
  }
  /* The grid LINES stop at the land, because ground is opaque. The numbers
     do not: they are chrome, you read the strip against them, and a hill in
     the first 40 px of the window would otherwise take the whole left-hand
     scale with it. So they are drawn after the silhouette, below. */

  /* --- the land ---
     The silhouette of the horizon profile, filled. It is drawn over the grid
     and under everything else, because ground is opaque: a grid line showing
     through a hill is the one thing that makes the strip read as a chart of
     angles rather than a view.

     Same warm grey-brown family as the ground shading it stands on, one step
     darker, with its own edge. Identical to the sea tint it would vanish
     into it, and the sea horizon is a different fact about the world: the
     dashed line below is where the water ends, this is where the land does.

     One pixel column can span several rays -- 120 degrees over 800 px is 1.5
     bins per pixel -- so take the MAXIMUM over the bins a column covers.
     Averaging them would shave every ridge crest, which is exactly the error
     terrain.py fetches a finer level to avoid. */
  if (HZ.prof) {
    const perPx = PANO.span / w / 0.1;
    const yClamp = y => y < -20 ? -20 : (y > h + 20 ? h + 20 : y);
    cx2.beginPath();
    cx2.moveTo(-1, h + 20);
    for (let x = 0; x <= w; x++) {
      const az = PANO.ctr + (x / w - 0.5) * PANO.span;
      let a;
      if (perPx > 1.05) {
        const hw = PANO.span / w / 2;
        a = -90;
        for (let k = Math.floor((az - hw) / 0.1); k <= Math.ceil((az + hw) / 0.1); k++) {
          const v = HZ.prof[((k % 3600) + 3600) % 3600];
          if (v > a) a = v;
        }
      } else {
        a = hzProf(az);
      }
      cx2.lineTo(x, yClamp(Y(a)));
    }
    cx2.lineTo(w + 1, h + 20);
    cx2.closePath();
    cx2.fillStyle = '#e6ded0';
    cx2.fill();
    cx2.strokeStyle = '#b9ad99';
    cx2.lineWidth = 1;
    cx2.stroke();
  }

  cx2.fillStyle = '#a89d8c';
  cx2.font = '10px -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  cx2.textAlign = 'left';
  cx2.textBaseline = 'middle';
  for (const [a, y] of gridY) {
    cx2.fillText((a > 0 ? '+' : '') + (stepAlt < 1 ? a.toFixed(1) : a) + '°', 3, y - 6);
  }

  /* --- the two horizons ---
     0 deg is the astronomical horizontal. The visible horizon sits below it
     by the dip, which is 9.8 arcmin from 30 m and worth showing separately:
     an object between the two lines is above the sea horizon but below
     level, which is where most of them are. */
  cx2.strokeStyle = '#c9bfae';
  cx2.beginPath(); cx2.moveTo(0, yH + 0.5); cx2.lineTo(w, yH + 0.5); cx2.stroke();

  if (yD > RULER && yD < h) {
    cx2.save();
    cx2.strokeStyle = '#b4531d';
    cx2.setLineDash([4, 4]);
    cx2.globalAlpha = 0.5;
    cx2.beginPath(); cx2.moveTo(0, yD + 0.5); cx2.lineTo(w, yD + 0.5); cx2.stroke();
    cx2.restore();
  }

  /* --- objects ---
     Drawn as a stroke from the base to the top, so the visible part of a
     distant object is the part above the dashed line. Colour is the same
     distance ramp the map uses. */
  const vis = view.filter(o => o.alt != null && Math.abs(dAz(o.az, PANO.ctr)) < half + 1);
  vis.sort((a, b) => a.dist - b.dist);                 // far behind near

  /* What is dotted is what is HIDDEN, and with a terrain profile that is
     usually a hill rather than the Earth.

     o.hor is the horizon at the object's own azimuth restricted to terrain
     in front of it, so everything below it on that column is behind
     something. It already contains the Earth's bulge: a ray over open water
     maxes out at exactly -dip, which is the old test. Without a profile the
     old test is all there is -- an object nearer than the horizon distance is
     wholly in front of the bulge and drawn solid to its foot, one beyond it
     is cut off at the grazing line. */
  const dHorizon = Math.sqrt(2 * REFF * Math.max(0.5, groundNow() + STATE.eye));
  for (const o of vis) {
    const x = X(o.az);
    const yt = Math.max(Y(o.alt), RULER);
    const yb = Math.min(Y(o.altBase != null ? o.altBase : 0), h);
    const yHid = o.hor != null ? Y(o.hor) : (o.dist > dHorizon ? yD : 1e9);
    const ySplit = Math.min(Math.max(yHid, yt), yb);
    const buried = o.hor != null && o.alt <= o.hor;
    const col = distColor(o.dist / 1000);
    const selected = o.i === STATE.sel;

    if (yb > ySplit) {                       // the hidden part
      cx2.save();
      cx2.strokeStyle = col;
      cx2.globalAlpha = selected ? 0.45 : 0.22;
      cx2.lineWidth = selected ? 2.5 : 1.4;
      cx2.setLineDash([2, 3]);
      cx2.beginPath();
      cx2.moveTo(x, ySplit);
      cx2.lineTo(x, yb);
      cx2.stroke();
      cx2.restore();
    }
    if (ySplit > yt) {
      cx2.strokeStyle = col;
      cx2.globalAlpha = selected ? 1 : 0.85;
      cx2.lineWidth = selected ? 2.5 : 1.4;
      cx2.beginPath();
      cx2.moveTo(x, yt);
      cx2.lineTo(x, ySplit);
      cx2.stroke();
    }
    // a cap at the top, which is the bit you actually match against a skyline
    cx2.globalAlpha = buried ? (selected ? 0.5 : 0.25) : 1;
    cx2.fillStyle = col;
    cx2.fillRect(x - 1.6, Math.max(yt, RULER) - 1.6, 3.2, 3.2);
    cx2.globalAlpha = 1;
  }

  /* --- labels, tallest first, skipped where they would collide --- */
  cx2.font = '11px -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  cx2.textBaseline = 'alphabetic';
  cx2.textAlign = 'left';
  /* Label density is a question of SCREEN WIDTH, not of azimuth.
     A fixed "3 per 10 degrees" budget caps a 45-degree window at about twelve
     labels however wide the strip is, so zooming in bought no extra detail and
     named buildings ate the whole allowance. Instead, offer every object in
     order of importance and let the collision stagger below decide what fits:
     it already knows the pixel geometry. The cap is only there to bound the
     work when a window holds thousands of objects. */
  const labelled = vis
    .filter(o => o.name || !NOLABEL.has(o.cat))
    .sort((a, b) => (b.name ? 1 : 0) - (a.name ? 1 : 0) || (b.ang || 0) - (a.ang || 0))
    .slice(0, 400);

  const taken = [];
  const clash = (x, tw, y) => taken.some(
    t => !(x + tw + 6 < t.x0 || x - 6 > t.x1) && Math.abs(y - t.y) < 12);

  for (const o of labelled) {
    const txt = o.name || CATLABEL[o.cat];
    const x = X(o.az), yt = Math.max(Y(o.alt), RULER);
    const tw = cx2.measureText(txt).width;

    /* Labels sit above the top cap, but the tallest object in the window is
       always hard against the ruler -- fitAlt scales the view to it -- so
       there is never room above it and it was the one object that never got
       a name. Fall back to placing the label below its cap. */
    /* Try a few rows above the cap, then a few below, and DROP the label if
       none of them is clear. Drawing it anyway once the attempts run out is
       what turned a dense window into a grey smear: the stagger looked like it
       was preventing overlap while quietly giving up and overprinting. Letting
       labels fall out here is what makes density self-limiting -- they fill
       the space available and stop. */
    let y = yt - 7, tries = 0;
    while (tries < 5 && clash(x, tw, y)) { y -= 12; tries++; }
    if (y < RULER + 12 || clash(x, tw, y)) {
      y = yt + 14;
      tries = 0;
      while (tries < 5 && clash(x, tw, y)) { y += 12; tries++; }
      if (y > h - 4 || clash(x, tw, y)) continue;
    }
    taken.push({ x0: x - 2, x1: x + tw + 2, y });
    cx2.fillStyle = o.i === STATE.sel ? '#b4531d' : (o.name ? '#2b2723' : '#8a8072');
    // an object the terrain hides keeps its name, at half weight
    cx2.globalAlpha = (o.hor != null && o.alt <= o.hor) ? 0.45 : 1;
    cx2.fillText(txt, x + 3, y);
    cx2.globalAlpha = 1;
  }

  /* --- azimuth ruler, drawn last so nothing overlaps it --- */
  cx2.fillStyle = '#fffefb';
  cx2.fillRect(0, 0, w, RULER);
  cx2.strokeStyle = '#ddd8cf';
  cx2.beginPath(); cx2.moveTo(0, RULER + 0.5); cx2.lineTo(w, RULER + 0.5); cx2.stroke();

  const stepAz = PANO.span > 200 ? 30 : PANO.span > 90 ? 10 : PANO.span > 30 ? 5 : 1;
  const CARD = { 0: 'N', 45: 'NE', 90: 'E', 135: 'SE', 180: 'S', 225: 'SW', 270: 'W', 315: 'NW' };
  const a0 = Math.ceil((PANO.ctr - half) / stepAz) * stepAz;
  cx2.textAlign = 'center';
  cx2.textBaseline = 'middle';
  for (let a = a0; a <= PANO.ctr + half; a += stepAz) {
    const az = (a + 720) % 360;
    const x = X(az);
    const card = CARD[az];
    cx2.strokeStyle = card ? '#2b2723' : '#c9bfae';
    cx2.beginPath();
    cx2.moveTo(x + 0.5, card ? 2 : RULER - 5);
    cx2.lineTo(x + 0.5, RULER);
    cx2.stroke();
    cx2.fillStyle = card ? '#2b2723' : '#6f6759';
    cx2.font = (card ? '600 11px ' : '10px ') + '-apple-system, "Segoe UI", Roboto, Arial, sans-serif';
    cx2.fillText(card || String(az), x, RULER / 2 - 1);
  }

  /* The map's wedge is redrawn here rather than at each call site. Keeping
     them separate meant every new way of changing the window had to remember
     to call both, and the wheel handler did not -- so zooming the strip left
     the map showing the old sector until something else happened to sync it. */
  syncRay();
  if (PANO.onScale) PANO.onScale();
  drawReadout(cx2, w, h, RULER);

  /* the azimuth under the pointer, for reading a bearing straight off */
  if (PANO.hover != null) {
    const x = X(PANO.hover);
    cx2.strokeStyle = '#1c1917';
    cx2.globalAlpha = 0.55;
    cx2.beginPath(); cx2.moveTo(x + 0.5, RULER); cx2.lineTo(x + 0.5, h); cx2.stroke();
    cx2.globalAlpha = 1;
    const s = PANO.hover.toFixed(1) + '°';
    cx2.font = '600 11px -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
    const tw = cx2.measureText(s).width;
    cx2.fillStyle = '#1c1917';
    cx2.fillRect(x - tw / 2 - 4, h - 18, tw + 8, 15);
    cx2.fillStyle = '#fffefb';
    cx2.fillText(s, x, h - 10);
  }
}

/* --- interaction: drag to pan, wheel to change the span --- */
(function () {
  let drag = null;
  const azAt = px => {
    const r = cv.getBoundingClientRect();
    return (PANO.ctr + (px - r.left - r.width / 2) / r.width * PANO.span + 720) % 360;
  };
  cv.addEventListener('pointerdown', e => {
    drag = { x: e.clientX, ctr: PANO.ctr, moved: 0 };
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    PANO.hover = azAt(e.clientX);
    if (drag) {
      const r = cv.getBoundingClientRect();
      const d = (e.clientX - drag.x) / r.width * PANO.span;
      drag.moved = Math.max(drag.moved, Math.abs(e.clientX - drag.x));
      PANO.ctr = (drag.ctr - d + 720) % 360;
    }
    drawPano();
  });
  cv.addEventListener('pointerleave', () => { PANO.hover = null; drawPano(); });
  cv.addEventListener('pointerup', e => {
    const wasDrag = drag && drag.moved > 4;
    drag = null;
    if (wasDrag) return;
    // a tap picks the nearest object in the window
    const az = azAt(e.clientX);
    let best = null, bd = 1e9;
    for (const o of view) {
      if (o.alt == null) continue;
      const d = Math.abs(dAz(o.az, az));
      if (d < bd) { bd = d; best = o; }
    }
    if (best && bd < PANO.span * 0.03) select(best, false);
  });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.shiftKey) {                       // vertical zoom, and stop auto-fitting
      PANO.topAuto = PANO.botAuto = false;
      const c = (PANO.altMax + PANO.altMin) / 2, r = (PANO.altMax - PANO.altMin) / 2;
      const k = e.deltaY > 0 ? 1.12 : 1 / 1.12;
      PANO.altMax = c + r * k; PANO.altMin = c - r * k;
    } else {
      PANO.span = Math.max(5, Math.min(360, PANO.span * (e.deltaY > 0 ? 1.12 : 1 / 1.12)));
      PANO.spanAuto = false;
    }
    drawPano();
  }, { passive: false });
  cv.addEventListener('dblclick', () => { PANO.topAuto = PANO.botAuto = true; drawPano(); });

  /* Pinch, for the phone. Two pointers on the strip scale the azimuth span
     about its centre. */
  const pts = new Map();
  let pinch0 = null;
  cv.addEventListener('pointerdown', e => pts.set(e.pointerId, e.clientX));
  cv.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, e.clientX);
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      const d = Math.abs(a - b);
      if (pinch0 == null) { pinch0 = { d, span: PANO.span }; return; }
      if (d > 10) {
        PANO.span = Math.max(5, Math.min(360, pinch0.span * pinch0.d / d));
        PANO.spanAuto = false;
        drawPano();
      }
    }
  });
  const clear = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch0 = null; };
  cv.addEventListener('pointerup', clear);
  cv.addEventListener('pointercancel', clear);
  /* Observe the WRAPPER, never the canvas: observing an element whose size
     you set inside the callback is how you build a resize loop. The guard is
     belt and braces. */
  let redrawing = false;
  new ResizeObserver(() => {
    if (redrawing) return;
    redrawing = true;
    requestAnimationFrame(() => { redrawing = false; drawPano(); });
  }).observe(document.getElementById('panobox'));
})();

/* The map's wedge follows the panorama window, so the two always agree
   about which way you are looking. */
function syncRay() {
  if (!map.getSource || !map.getSource('wedge')) return;
  const pts = [[STATE.lon, STATE.lat]];
  const R = 6371008.8, km = Math.min(STATE.maxd, 150) * 1000;
  for (let a = -PANO.span / 2; a <= PANO.span / 2; a += Math.max(1, PANO.span / 60)) {
    const br = (PANO.ctr + a) * D2R, dr = km / R;
    const p1 = STATE.lat * D2R, l1 = STATE.lon * D2R;
    const p2 = Math.asin(Math.sin(p1) * Math.cos(dr) + Math.cos(p1) * Math.sin(dr) * Math.cos(br));
    const l2 = l1 + Math.atan2(Math.sin(br) * Math.sin(dr) * Math.cos(p1),
                               Math.cos(dr) - Math.sin(p1) * Math.sin(p2));
    pts.push([l2 * R2D, p2 * R2D]);
  }
  pts.push([STATE.lon, STATE.lat]);
  map.getSource('wedge').setData({
    type: 'Feature', geometry: { type: 'Polygon', coordinates: [pts] }
  });
}


/* Vertical scale, collapsed by default. Auto is the norm; the manual controls
   exist for the case auto cannot serve -- a near mast at 20 degrees and a
   distant skyline at 0.2 cannot share one sensible automatic range.

   Both sliders are logarithmic. Nearly all the use is between 0.5 and 3
   degrees, but a mast a few hundred metres away needs 20 or more, and a linear
   sweep over that range would put the whole useful part in the first tenth of
   the travel. */
(function () {
  const btn = document.getElementById('vs-toggle');
  const box = document.getElementById('vs');
  const top = document.getElementById('alttop'), bot = document.getElementById('altbot');
  const topA = document.getElementById('alttopauto'), botA = document.getElementById('altbotauto');
  const topV = document.getElementById('alttop-val'), botV = document.getElementById('altbot-val');

  const TOP_LO = 0.2, TOP_HI = 60, BOT_LO = 0.1, BOT_HI = 20;
  const logTo = (t, lo, hi) => lo * Math.pow(hi / lo, t);
  const logFrom = (v, lo, hi) =>
    Math.log(Math.min(hi, Math.max(lo, v)) / lo) / Math.log(hi / lo);
  const show = v => (Math.abs(v) < 10 ? v.toFixed(2) : v.toFixed(0)) + '°';

  btn.onclick = () => {
    const open = box.hidden;
    box.hidden = !open;
    btn.setAttribute('aria-expanded', String(open));
    if (open) sync();
  };

  function sync() {
    top.disabled = topA.checked;
    bot.disabled = botA.checked;
    top.value = Math.round(logFrom(PANO.altMax, TOP_LO, TOP_HI) * 1000);
    bot.value = Math.round(logFrom(-PANO.altMin, BOT_LO, BOT_HI) * 1000);
    topV.textContent = show(PANO.altMax);
    botV.textContent = show(PANO.altMin);
  }
  PANO.onScale = () => { if (!box.hidden) sync(); };

  topA.onchange = () => { PANO.topAuto = topA.checked; sync(); drawPano(); };
  botA.onchange = () => { PANO.botAuto = botA.checked; sync(); drawPano(); };
  top.oninput = () => {
    PANO.topAuto = false; topA.checked = false;
    PANO.altMax = logTo(+top.value / 1000, TOP_LO, TOP_HI);
    if (PANO.altMax - PANO.altMin < 0.15) PANO.altMin = PANO.altMax - 0.15;
    sync(); drawPano();
  };
  bot.oninput = () => {
    PANO.botAuto = false; botA.checked = false;
    PANO.altMin = -logTo(+bot.value / 1000, BOT_LO, BOT_HI);
    if (PANO.altMax - PANO.altMin < 0.15) PANO.altMax = PANO.altMin + 0.15;
    sync(); drawPano();
  };
  sync();
})();

/* Hamburger. Mobile only -- on desktop the panel is always there. */
const NARROW = () => window.matchMedia('(max-width: 820px)').matches;
const burger = document.getElementById('burger');
const setMenu = on => {
  document.body.classList.toggle('menu', on);
  burger.setAttribute('aria-expanded', String(on));
};
burger.onclick = () => setMenu(!document.body.classList.contains('menu'));

const listbtn = document.getElementById('listbtn');
listbtn.onclick = () => {
  const on = !document.body.classList.contains('list');
  document.body.classList.toggle('list', on);
  listbtn.setAttribute('aria-expanded', String(on));
  if (on) renderRows();               // built lazily; the sheet is usually shut
};
document.getElementById('scrim').onclick = () => setMenu(false);
window.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
window.addEventListener('resize', () => {
  if (!NARROW()) setMenu(false);
  if (PANO.spanAuto) { PANO.span = NARROW() ? 45 : 120; drawPano(); }
});

/* resizer */
(function () {
  const r = document.getElementById('resizer'), p = document.getElementById('side');
  let on = false;
  r.onmousedown = e => { on = true; r.classList.add('drag'); e.preventDefault(); };
  window.onmousemove = e => {
    if (!on) return;
    const w = Math.max(320, Math.min(760, e.clientX));
    p.style.width = w + 'px'; p.style.flexBasis = w + 'px';
  };
  window.onmouseup = () => { on = false; r.classList.remove('drag'); };
})();
</script>
